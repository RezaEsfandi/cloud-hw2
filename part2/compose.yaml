services:
  app:
    build: .
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - queue-data:/data

  proxy:
    image: nginx:1.30-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  queue-data:
